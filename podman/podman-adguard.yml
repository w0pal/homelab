services:
  adguardhome:
    container_name: adguardhome
    image: docker.io/adguard/adguardhome:latest
    restart: always
    labels:
      io.containers.autoupdate: registry
    network_mode: host
    volumes:
      - ${HOME}/containers/adguardhome/work:/opt/adguardhome/work
      - ${HOME}/containers/adguardhome/conf:/opt/adguardhome/conf
