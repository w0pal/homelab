services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=ROW --innodb-file-per-table=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    networks:
      - backend

  app:
    image: nextcloud:stable-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_DATA_DIR: /mnt/nextcloud-data
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.lab
      OVERWRITEHOST: nextcloud.lab
      OVERWRITEPROTOCOL: https
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    volumes:
      - app:/var/www/html
      - ./data:/mnt/nextcloud-data
      - /home/tomori/storage:/mnt/host-storage
      - /mnt/usb-sda:/mnt/usb-sda
      - /mnt/backup/gdrive:/mnt/backup/gdrive
      - ./apache-mpm.conf:/etc/apache2/mods-available/mpm_prefork.conf:ro
    mem_limit: 2g
    networks:
      - backend
      - shared-web

  storage-watcher:
    image: alpine:3.20
    restart: unless-stopped
    command: >-
      sh -c "apk add --no-cache inotify-tools >/dev/null 2>&1 &&
      inotifywait -m -r -e create,moved_to,close_write,delete,moved_from -q --format '%w%f' /watch
      | while IFS= read -r p; do
          if [ -d \"$$p\" ]; then printf '%s\n' \"$$p\" >> /queue/changed;
          else dirname \"$$p\" >> /queue/changed; fi
        done"
    volumes:
      - /home/tomori/storage:/watch:ro
      - ./scan-queue:/queue

networks:
  backend:
  shared-web:
    external: true

volumes:
  app:
  db:
  redis:
