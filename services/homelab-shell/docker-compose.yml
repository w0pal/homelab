services:
  homelab-shell:
    build: .
    image: homelab-shell:local
    container_name: homelab-shell
    hostname: takamatsu
    restart: unless-stopped
    env_file: .env
    # Read-only host mounts: commands see the HOST's /proc, /sys, os-release
    # and root filesystem. Nothing writable, no docker socket, no ports.
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /etc/os-release:/etc/os-release:ro
      - /:/host:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

# Run: docker compose up -d --build
# Outbound HTTPS only — the worker polls the portfolio API for jobs.
