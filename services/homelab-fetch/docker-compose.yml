services:
  homelab-fetch:
    build: .
    image: homelab-fetch:local
    container_name: homelab-fetch
    restart: unless-stopped
    env_file: .env
    # Read-only host mounts: fastfetch reads the HOST's /proc, /sys and
    # os-release, and statfs the host root via /host. Nothing writable.
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /etc/os-release:/etc/os-release:ro
      - /:/host:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

# Run: docker compose up -d --build
# No ports, no docker socket, no shared network needed — outbound HTTPS only.
