version: '3.8'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      - DOMAIN=https://takamatsu.tailb43e01.ts.net
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${TOKEN}
      - LOG_LEVEL=info
      - EXTENDED_LOGGING=true
    volumes:
      - ./vw-data:/data
    ports:
      - "192.168.0.240:8080:80"
    networks:
      - shared-web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  shared-web:
    external: true

# Run: docker compose up -d
# Setup Cloudflare Tunnel for HTTPS + passkeys:
# 1. cloudflared tunnel login
# 2. cloudflared tunnel create vaultwarden
# 3. cloudflared tunnel route dns vaultwarden vault.yourdomain.com
# 4. Add CLOUDFLARE_TUNNEL_TOKEN to environment
# Access: https://vault.yourdomain.com