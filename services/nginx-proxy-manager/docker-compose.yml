services:
  app:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: always
    ports:
      - "192.168.0.240:80:80"
      - "192.168.0.240:443:443"
      - "192.168.0.240:81:81"
    networks:
      - shared-web
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

networks:
  shared-web:
    external: true
