# Vaultwarden vhost for takamatsu.tailb43e01.ts.net — LAN access without Tailscale.
#
# How it works: AdGuard Home rewrites takamatsu.tailb43e01.ts.net -> 192.168.0.240
# for LAN clients, so this vhost (NPM on 192.168.0.240:443) serves them directly.
# Tailnet clients still hit Tailscale serve (:8443 or :443), not this vhost.
# Public Funnel on :443 only routes /9router — Vaultwarden stays off the internet.
#
# This file is NOT managed by the NPM UI. Deployed copy lives at
# /data/nginx/custom/http.conf inside the nginx-proxy-manager container
# (host: ~/containers/nginx-proxy-manager/data/nginx/custom/http.conf).
# After editing: docker cp custom-http.conf nginx-proxy-manager:/data/nginx/custom/http.conf
#                 docker exec nginx-proxy-manager nginx -t
#                 docker exec nginx-proxy-manager nginx -s reload
#
# Cert: real Let's Encrypt cert issued via `tailscale cert`, stored at
# /data/custom-certs/takamatsu.tailb43e01.ts.net/ in the container.
# Renewed weekly by ~/homelab/scripts/renew-takamatsu-cert.sh (user crontab).

map $http_upgrade $vw_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name takamatsu.tailb43e01.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name takamatsu.tailb43e01.ts.net;

    ssl_certificate     /data/custom-certs/takamatsu.tailb43e01.ts.net/takamatsu.tailb43e01.ts.net.crt;
    ssl_certificate_key /data/custom-certs/takamatsu.tailb43e01.ts.net/takamatsu.tailb43e01.ts.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Bitwarden attachments / large imports
    client_max_body_size 128M;

    location / {
        proxy_pass http://192.168.0.240:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Websocket support (Bitwarden sync notifications: /notifications/hub)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $vw_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
