services:
  bot:
    build: .
    container_name: opencode-bot
    restart: unless-stopped
    mem_limit: 256m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
