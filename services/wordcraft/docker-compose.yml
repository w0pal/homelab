# Reconstructed from `docker inspect` on takamatsu (2026-11-24).
# These two containers run via `docker run`; no compose file exists on the host.
services:
  web:
    image: nginx:alpine
    container_name: wordcraft-web
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "8090:80"
    volumes:
      - /home/tomori/Projects/wordcraft-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/tomori/Projects/wordcraft-web/wordcraft-web-0.18.1:/usr/share/nginx/html:ro

  files:
    image: node:22-alpine
    container_name: wordcraft-files
    restart: unless-stopped
    command: ["node", "/server.mjs"]
    environment:
      DOC_ROOT: /home/tomori
      FONTS_DIR: /fonts
      PORT: 8091
      APP_DIR: /app
    ports:
      - "8091:8091"
    volumes:
      - /home/tomori/Projects/wordcraft-web/wordcraft-web-0.18.1:/app:ro
      - /home/tomori/Projects/wordcraft-web/fonts:/fonts:ro
      - /home/tomori/Projects/wordcraft-web/server.mjs:/server.mjs:ro
      - /home/tomori:/home/tomori
